<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PedSMARxT — SSTI treatment cheat sheet</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">PedSMARxT SSTI treatment cheat sheet — purulent folliculitis and impetigo spectrum, furuncle/abscess cellulitis, and non-purulent cellulitis</h2>

<div class="outer">
  <div class="header">
    <span class="rx-badge">PedSMARxT</span>
    <span class="header-title">SSTI treatment cheat sheet</span>
    <span class="header-sub">Pediatric Antibiotic Edition</span>
  </div>

  <div id="disease-purulent"></div>
  <div id="disease-non-purulent"></div>

  <div class="footer">
    <span class="footer-tag">COLLEGE OF PHARMACY · WONDERS OF PHARMACY</span>
    <span style="color:#5DCAA5;font-size:16px;font-weight:500;">+</span>
  </div>
</div>
<script>
(function() {
  var docClickBound = false;
  function initNpPills() {
    document.querySelectorAll('.np-pill-group').forEach(function(group) {
      group.querySelectorAll('.np-pill').forEach(function(pill) {
        if (pill.dataset.npPillInit) return;
        pill.dataset.npPillInit = '1';
        pill.setAttribute('role', 'button');
        pill.setAttribute('tabindex', '0');
        pill.addEventListener('click', function() {
          var was = pill.classList.contains('is-open');
          group.querySelectorAll('.np-pill').forEach(function(p) { p.classList.remove('is-open'); });
          if (!was) pill.classList.add('is-open');
        });
        pill.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            pill.click();
          }
        });
      });
    });
    if (!docClickBound) {
      docClickBound = true;
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.np-pill')) {
          document.querySelectorAll('.np-pill.is-open').forEach(function(p) { p.classList.remove('is-open'); });
        }
      });
    }
  }

  // Fetch requires http(s) or a local static server; file:// often fails.
  Promise.all([
    fetch('./diseases/purulent-cellulitis/section.html'),
    fetch('./diseases/non-purulent-cellulitis/section.html')
  ]).then(function(responses) {
    if (!responses[0].ok || !responses[1].ok) {
      throw new Error('Failed to load disease sections: ' + responses[0].status + ' / ' + responses[1].status);
    }
    return Promise.all([responses[0].text(), responses[1].text()]);
  }).then(function(htmls) {
    var pur = document.getElementById('disease-purulent');
    var np = document.getElementById('disease-non-purulent');
    pur.innerHTML = htmls[0];
    np.innerHTML = htmls[1];
    initNpPills();
  }).catch(function(err) {
    console.error(err);
    var pur = document.getElementById('disease-purulent');
    if (pur) {
      var msg = document.createElement('p');
      msg.textContent = 'Could not load cheat sheet content. Use a local web server (e.g. npx serve) or open the GitHub Pages URL — opening index.html as file:// usually blocks loading partials.';
      msg.style.cssText = 'color:#A32D2D;padding:1rem;font-family:system-ui,sans-serif;max-width:40rem;';
      pur.appendChild(msg);
    }
  });
})();
</script>
</body>
</html>
